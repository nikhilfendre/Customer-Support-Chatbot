<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SupportBot - Customer Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #chat-app {
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 620px;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }

    /* Header */
    #chat-header {
      background: #1a73e8;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #chat-header .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    #chat-header .info .title {
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #chat-header .info .subtitle {
      color: rgba(255,255,255,0.75);
      font-size: 12px;
    }
    #chat-header .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      color: rgba(255,255,255,0.85);
      font-size: 12px;
    }
    #chat-header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f7f9ff;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 88%;
    }
    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.bot .bubble {
      background: #ffffff;
      color: #222;
      border: 1px solid #dce3f0;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #1a73e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }
    .typing .bubble span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1.2s infinite;
    }
    .typing .bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing .bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Quick replies */
    #quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 14px;
      background: #ffffff;
      border-top: 1px solid #eef0f5;
    }
    .qr-btn {
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid #1a73e8;
      border-radius: 20px;
      background: #eef4ff;
      color: #1a73e8;
      cursor: pointer;
      transition: background 0.15s;
    }
    .qr-btn:hover { background: #d0e4ff; }

    /* Input row */
    #input-row {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #eef0f5;
      background: #ffffff;
    }
    #user-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
      color: #222;
    }
    #user-input:focus { border-color: #1a73e8; }
    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1a73e8;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-btn:hover { background: #1558b0; }
  </style>
</head>
<body>

<div id="chat-app">

  <!-- Header -->
  <div id="chat-header">
    <div class="avatar">🎧</div>
    <div class="info">
      <div class="title">SupportBot</div>
      <div class="subtitle">Customer Support Assistant</div>
    </div>
    <div class="status">
      <div class="dot"></div>
      Online
    </div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Quick replies -->
  <div id="quick-replies"></div>

  <!-- Input -->
  <div id="input-row">
    <input id="user-input" type="text" placeholder="Type your issue here…" />
    <button id="send-btn">&#9658;</button>
  </div>

</div>

<script>

  // ─── RULES ────────────────────────────────────────────────────────────────
  const rules = [
    {
      keywords: ["hello", "hi", "hey", "good morning", "good evening", "start", "help"],
      response: "Hi there! 👋 Welcome to Support. I can help you with orders, returns, payments, delivery, account, and more. What's your issue today?"
    },

    // ORDER
    {
      keywords: ["order", "orders", "my order", "order status", "placed order", "purchase"],
      response: "📦 To check your order status, visit My Orders on our website or app. You'll need your Order ID (found in your confirmation email). Need help with something specific about your order?"
    },
    {
      keywords: ["cancel order", "cancel my order", "cancellation"],
      response: "❌ Orders can be cancelled within 24 hours of placing them. Go to My Orders → Select Order → Cancel. If it's already shipped, you'll need to raise a return request after delivery."
    },
    {
      keywords: ["modify order", "change order", "edit order", "update order"],
      response: "✏️ Orders can only be modified before they are packed. Please contact us immediately at support@company.com or call 1800-123-456 with your Order ID to request changes."
    },

    // RETURN & REFUND
    {
      keywords: ["return", "returns", "send back", "return policy", "return request"],
      response: "🔄 You can return most items within 7 days of delivery. Go to My Orders → Select Item → Return. Our team will arrange a pickup within 2-3 business days. Items must be unused and in original packaging."
    },
    {
      keywords: ["refund", "refunds", "money back", "when will i get refund", "refund status"],
      response: "💰 Refunds are processed within 5-7 business days after we receive the returned item. The amount is credited back to your original payment method. Bank transfers may take an extra 2-3 days."
    },
    {
      keywords: ["exchange", "replace", "replacement", "swap"],
      response: "🔁 We offer free exchanges for defective or wrong items. Go to My Orders → Select Item → Exchange, or email support@company.com with your Order ID and the issue."
    },

    // DELIVERY
    {
      keywords: ["delivery", "shipping", "when will", "arrive", "dispatch", "track", "tracking"],
      response: "🚚 Standard delivery takes 3-5 business days. Express delivery takes 1-2 days. Use the tracking link in your confirmation email, or go to My Orders to track in real time."
    },
    {
      keywords: ["late delivery", "delayed", "not delivered", "missing package", "where is my order"],
      response: "😟 Sorry for the delay! If your order is past the estimated date, please share your Order ID at support@company.com or chat with us. We'll investigate immediately and update you within 24 hours."
    },
    {
      keywords: ["wrong item", "wrong product", "wrong order", "incorrect item", "different item"],
      response: "😮 We're sorry you received the wrong item! Please email support@company.com with your Order ID and a photo of the item received. We'll send the correct item or issue a full refund right away."
    },
    {
      keywords: ["damaged", "broken", "defective", "not working", "faulty", "torn"],
      response: "😔 We're sorry about the damaged product! Email support@company.com with your Order ID and a photo. We'll arrange a replacement or full refund within 48 hours — no need to return the item."
    },

    // PAYMENT
    {
      keywords: ["payment", "paid", "charge", "charged", "billing", "invoice", "receipt"],
      response: "💳 For payment issues, check your bank statement first. If you were charged but didn't receive an order confirmation, email support@company.com with the transaction ID and amount. We'll resolve it within 24 hours."
    },
    {
      keywords: ["payment failed", "transaction failed", "couldn't pay", "payment not done", "declined"],
      response: "⚠️ Payment failures are usually due to bank issues or card limits. Try again with a different card or use UPI/Net Banking. If money was deducted but order wasn't placed, it'll be auto-refunded in 5-7 days."
    },
    {
      keywords: ["coupon", "promo", "discount", "voucher", "offer", "code"],
      response: "🎁 Apply coupon codes at checkout in the 'Apply Coupon' field. Coupons are valid for specific products and timeframes. If your code isn't working, check the expiry date or email us the code and we'll verify it."
    },

    // ACCOUNT
    {
      keywords: ["account", "profile", "my account", "sign in", "login", "log in", "sign up"],
      response: "👤 You can manage your account at our website under My Account. To reset your password, click 'Forgot Password' on the login page. For account lockouts, email support@company.com with your registered email."
    },
    {
      keywords: ["password", "forgot password", "reset password", "change password"],
      response: "🔑 To reset your password: go to the login page → click 'Forgot Password' → enter your registered email → check your inbox for the reset link. Link expires in 30 minutes."
    },
    {
      keywords: ["delete account", "close account", "remove account", "deactivate"],
      response: "⚠️ To delete your account, email support@company.com from your registered email address with the subject 'Account Deletion Request'. Note: this action is irreversible and all order history will be lost."
    },

    // PRODUCT
    {
      keywords: ["product", "item", "stock", "available", "availability", "out of stock", "when available"],
      response: "🛍️ If an item is out of stock, click 'Notify Me' on the product page and we'll email you when it's back. For bulk orders or corporate purchases, contact sales@company.com."
    },
    {
      keywords: ["warranty", "guarantee", "repair", "service center"],
      response: "🛡️ Most products come with a 1-year manufacturer warranty. For warranty claims, email support@company.com with your Order ID and product issue. We'll connect you with the service center."
    },

    // CONTACT
    {
      keywords: ["contact", "speak", "agent", "human", "representative", "call", "phone", "email"],
      response: "📞 You can reach us at:\n📧 support@company.com\n📱 1800-123-456 (Mon–Sat, 9am–6pm)\n💬 Live Chat on our website\nWe typically respond within 2-4 hours."
    },

    // THANKS / BYE
    {
      keywords: ["thank", "thanks", "thank you", "thankyou", "helpful", "great", "awesome", "solved"],
      response: "You're welcome! 😊 Happy to help. Is there anything else I can assist you with?"
    },
    {
      keywords: ["no", "nothing", "that's all", "all good", "done", "ok thanks"],
      response: "Great! If you ever need help again, we're always here. Have a wonderful day! 🌟"
    },
    {
      keywords: ["bye", "goodbye", "see you", "cya", "exit", "quit"],
      response: "Goodbye! 👋 Thank you for contacting support. Have a great day!"
    }
  ];

  const fallbacks = [
    "I'm sorry, I didn't quite understand that. Could you rephrase? Or choose from the quick options below. 🙂",
    "I'm not sure about that. For complex issues, please email support@company.com or call 1800-123-456.",
    "That seems outside my current knowledge. A human agent can help — email support@company.com with your query.",
    "Sorry, I couldn't find an answer. Please contact our team at 1800-123-456 (Mon–Sat, 9am–6pm)."
  ];

  const suggestions = [
    "Track my order", "Return an item", "Refund status",
    "Payment failed", "Wrong item received", "Contact support"
  ];

  // ─── LOGIC ────────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const qrEl       = document.getElementById('quick-replies');

  function getBotReply(input) {
    const lower = input.toLowerCase();
    for (const rule of rules) {
      if (rule.keywords.some(k => lower.includes(k))) {
        return rule.response;
      }
    }
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
  }

  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const formattedText = text.replace(/\n/g, '<br>');
    if (role === 'bot') {
      msg.innerHTML = `<div class="bot-icon">🤖</div><div class="bubble">${formattedText}</div>`;
    } else {
      msg.innerHTML = `<div class="bubble">${formattedText}</div>`;
    }
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot typing';
    msg.id = 'typing-indicator';
    msg.innerHTML = `<div class="bot-icon">🤖</div><div class="bubble"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function renderQuickReplies() {
    qrEl.innerHTML = '';
    suggestions.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = s;
      btn.onclick = () => sendMessage(s);
      qrEl.appendChild(btn);
    });
  }

  function sendMessage(text) {
    const userText = text || inputEl.value.trim();
    if (!userText) return;
    inputEl.value = '';
    addMessage('user', userText);
    showTyping();
    setTimeout(() => {
      removeTyping();
      const reply = getBotReply(userText);
      addMessage('bot', reply);
    }, 600);
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  document.getElementById('send-btn').onclick = () => sendMessage();
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  addMessage('bot', "Hello! 👋 Welcome to Customer Support. I'm here to help you with orders, returns, refunds, payments, and more. How can I assist you today?");
  renderQuickReplies();

</script>
</body>
</html>
